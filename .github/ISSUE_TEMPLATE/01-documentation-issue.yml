name: Documentation issue
description: Report incorrect, unclear, outdated, or missing documentation
labels:
  - documentation
body:

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        Explain what is incorrect, unclear, outdated, or missing and how it
        affected your work. **Don't share confidential data.**
        [More](https://zensical.org/contributing/documentation/#description)
      placeholder: |-
        Describe the documentation problem.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: >-
        Optional: suggest how the documentation could improve.
        [More](https://zensical.org/contributing/documentation/#proposed-change)
      placeholder: |-
        Suggest a change or new wording.

  - type: textarea
    id: related-links
    attributes:
      label: Related links
      description: >-
        Link to the [documentation](https://zensical.org/docs/) page or section
        that needs improvement and any related
        [issues](https://github.com/zensical/docs/issues).
        [More](https://zensical.org/contributing/documentation/#related-links)
      placeholder: |-
        Paste relevant URLs here.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      description: >-
        Confirm that you have completed each step.
        [More](https://zensical.org/contributing/documentation/#checklist)
      options:
        - label: >-
            I have read and followed the [documentation issue guidelines](https://zensical.org/contributing/documentation/).
          required: true
        - label: >-
            I have attached the links to the affected sections of [the documentation](https://zensical.org/contributing/documentation/#related-links).
          required: true
